services:
  mongo:
    image: mongo:7
    # Loopback only (this dev Mongo has no authentication). Set MONGO_PORT if 27017 is taken by a local mongod.
    ports: ["127.0.0.1:${MONGO_PORT:-27017}:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: backend/Dockerfile
    depends_on:
      mongo: { condition: service_healthy }
    # Loopback only: with TRUST_PROXY_HOPS=1 the API trusts X-Forwarded-For, which anyone who can reach this port
    # directly could forge to dodge the rate limit. The browser path is the web service below.
    ports: ["127.0.0.1:${API_PORT:-3000}:3000"]
    environment:
      NODE_ENV: development # production sets Secure cookies, which need HTTPS
      # One proxy (the web service) sits in front: without this every visitor shares the proxy address and therefore
      # one rate-limit bucket. Count every proxy in front of the API (add one for a load balancer in front of web).
      # Named API_TRUST_PROXY_HOPS because compose also reads backend/.env, whose TRUST_PROXY_HOPS=0 is for running
      # the API without a proxy and would silently override this default.
      TRUST_PROXY_HOPS: ${API_TRUST_PROXY_HOPS:-1}
      MONGODB_URI: mongodb://mongo:27017/easygenerator
      SESSION_SECRET: "${SESSION_SECRET:?generate one with: openssl rand -base64 32}"
      # Must equal the origin the BROWSER uses: the CSRF guard compares it with the request's Origin even when the
      # request arrives through the web proxy. With the `web` service below that is http://localhost:8080
      # (set CORS_ORIGIN=http://localhost:8080); with `npm run dev:frontend` it is http://localhost:5173.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
  web:
    # Frontend: nginx serves the SPA and proxies /api to the api service (same origin, /api prefix preserved).
    profiles: ["app"]
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports: ["${WEB_PORT:-8080}:8080"]
    environment:
      BACKEND_URL: http://api:3000
      # edge (default): nginx is the first proxy and overwrites X-Forwarded-For/-Proto/-Host from the socket, so a
      # client cannot pick its rate-limit bucket or claim HTTPS. Put a TLS-terminating load balancer you control in
      # front and use trusted instead, together with API_TRUST_PROXY_HOPS=2 (load balancer + nginx) on the api.
      FORWARDED_HEADERS_MODE: ${WEB_FORWARDED_HEADERS_MODE:-edge}
