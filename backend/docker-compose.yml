services:
  mongo:
    image: mongo:7
    # Loopback only (this dev Mongo has no authentication). Set MONGO_PORT if 27017 is taken by a local mongod.
    ports: ["127.0.0.1:${MONGO_PORT:-27017}:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: backend/Dockerfile
    depends_on:
      mongo: { condition: service_healthy }
    ports: ["${API_PORT:-3000}:3000"]
    environment:
      NODE_ENV: development # production sets Secure cookies, which need HTTPS
      MONGODB_URI: mongodb://mongo:27017/easygenerator
      SESSION_SECRET: "${SESSION_SECRET:?generate one with: openssl rand -base64 32}"
      # Must equal the origin the BROWSER uses: the CSRF guard compares it with the request's Origin even when the
      # request arrives through the web proxy. With the `web` service below that is http://localhost:8080
      # (set CORS_ORIGIN=http://localhost:8080); with `npm run dev:frontend` it is http://localhost:5173.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
  web:
    # Frontend: nginx serves the SPA and proxies /api to the api service (same origin, /api prefix preserved).
    profiles: ["app"]
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports: ["${WEB_PORT:-8080}:8080"]
    environment:
      BACKEND_URL: http://api:3000
