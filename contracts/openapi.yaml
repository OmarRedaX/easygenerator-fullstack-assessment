openapi: 3.1.0
info:
  title: Easygenerator Auth API
  version: 0.1.0
  description: |
    Cookie-session authentication (sign up, sign in, logout, protected `me`).
    The session cookie is `httpOnly`, `SameSite=Lax`. Every unsafe request (POST) must carry an `Origin`
    header equal to the configured frontend origin (or a matching `Referer`); otherwise it fails closed with 403.
    Supported topology: frontend and API on the same site.
servers:
  - url: /api
tags:
  - name: auth
    description: Sign up, sign in, logout and the protected current-user endpoint.
  - name: health
    description: Liveness check including a MongoDB ping.
paths:
  /auth/signup:
    post:
      tags: [auth]
      operationId: signUp
      summary: Create an account and start a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignUpRequest' }
      responses:
        '201':
          description: Account created; session cookie set.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Email already registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/signin:
    post:
      tags: [auth]
      operationId: signIn
      summary: Verify credentials and start a session (new session id)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignInRequest' }
      responses:
        '200':
          description: Signed in; session cookie set.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Invalid email or password (identical for unknown email and wrong password).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Destroy the server-side session and clear the cookie
      security: [{ cookieAuth: [] }]
      responses:
        '204': { description: Logged out. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Protected endpoint - the current user
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness and MongoDB ping
      security: []
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
        '503':
          description: Database unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
  headers:
    SetCookie:
      description: Session cookie (`sid`), httpOnly, SameSite=Lax, Secure in production, 7-day absolute lifetime.
      schema: { type: string }
  schemas:
    SignUpRequest:
      type: object
      additionalProperties: false
      required: [email, name, password]
      properties:
        email: { type: string, format: email, maxLength: 254, description: Trimmed and lowercased by the server. }
        name: { type: string, minLength: 3, maxLength: 80, description: Trimmed by the server. }
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: >-
            At least one letter [A-Za-z], one digit [0-9] and one special character from the ASCII
            punctuation set. A space is not a special character.
          pattern: '^(?=.*[A-Za-z])(?=.*[0-9])(?=.*[!-/:-@\[-`{-~]).{8,128}$'
    SignInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1 }
    User:
      type: object
      required: [id, email, name, createdAt]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        createdAt: { type: string, format: date-time }
    UserEnvelope:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }
    Error:
      type: object
      required: [statusCode, error, message, requestId]
      properties:
        statusCode: { type: integer }
        error: { type: string }
        message: { type: string }
        requestId: { type: string }
        details:
          type: array
          items:
            type: object
            required: [field, messages]
            properties:
              field: { type: string }
              messages: { type: array, items: { type: string } }
  responses:
    ValidationError:
      description: Validation failed (per-field `details`) or malformed JSON.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, invalid or expired session.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: CSRF check failed (missing/mismatched Origin and Referer).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: Request body over 16 kb.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
