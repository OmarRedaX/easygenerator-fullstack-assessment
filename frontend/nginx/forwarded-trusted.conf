# FORWARDED_HEADERS_MODE=trusted (opt-in): this nginx sits behind a load balancer that you control, terminates TLS
# and sets X-Forwarded-For / X-Forwarded-Proto itself. Only enable it when no client can reach this nginx (or the
# backend) directly, otherwise any client can forge its address. nginx appends the load balancer's address to the
# chain, so the backend must trust two hops: API_TRUST_PROXY_HOPS=2 (load balancer + nginx).
# X-Forwarded-Proto is honoured only when it is exactly "http" or "https" ($forwarded_proto, see the template).
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
