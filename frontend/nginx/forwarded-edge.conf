# FORWARDED_HEADERS_MODE=edge (default): this nginx is the first proxy the client reaches, so nothing the client
# sends about its own address, scheme or host is believed. The backend (TRUST_PROXY_HOPS=1) then reads the
# right-most X-Forwarded-For entry, which is the socket address nginx saw, and the real scheme and host.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
# Other headers that name a client address: dropped so nothing downstream can start trusting them by accident.
proxy_set_header X-Real-IP "";
proxy_set_header Forwarded "";
